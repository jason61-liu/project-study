services:
  agent-a:
    build: .
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/research.db
    ports: ["8080:8080"]
    volumes: ["research-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      timeout: 2s
      retries: 5
  agent-b:
    build: .
    environment:
      PORT: "8081"
      DATABASE_PATH: /data/research.db
    ports: ["8081:8081"]
    volumes: ["research-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz')"]
      interval: 5s
      timeout: 2s
      retries: 5

volumes:
  research-data:

