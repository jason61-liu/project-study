<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
<style>text{font-family:"Hiragino Sans GB","Arial Unicode MS","Heiti SC","Helvetica Neue",Helvetica,Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#111827}.sub{font-size:14px;fill:#6b7280}.lane{font-size:13px;font-weight:700;fill:#2563eb}.node-title{font-size:14px;font-weight:700;fill:#111827}.node-sub{font-size:11px;fill:#6b7280}.edge{fill:none;stroke-width:2.2}.edge-label{font-size:11px;font-weight:600;fill:#4b5563}.legend{font-size:12px;fill:#4b5563}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
</defs>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="600" y="48" text-anchor="middle" class="title">Agent 委托授权与确定性执行边界</text>
<text x="600" y="75" text-anchor="middle" class="sub">ID Token 终止于登录会话；受众受限 Access Token 只进入工具执行面</text>
<rect x="40" y="110" width="320" height="520" rx="12" fill="#eff6ff" fill-opacity="0.45" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="58" y="138" class="lane">身份域</text>
<text x="58" y="159" class="node-sub">用户认证与授权服务器</text>
<rect x="440" y="110" width="320" height="520" rx="12" fill="#faf5ff" fill-opacity="0.45" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="458" y="138" class="lane">Agent 控制域</text>
<text x="458" y="159" class="node-sub">模型只产生意图，不持有原始凭证</text>
<rect x="840" y="110" width="320" height="520" rx="12" fill="#f0fdf4" fill-opacity="0.45" stroke="#86efac" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="858" y="138" class="lane">资源与执行域</text>
<text x="858" y="159" class="node-sub">每次调用重新鉴权并审计</text>
<rect x="90" y="185" width="220" height="64" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
<text x="200.0" y="212" text-anchor="middle" class="node-title">用户</text>
<text x="200.0" y="232" text-anchor="middle" class="node-sub">登录、授权、确认高风险动作</text>
<rect x="90" y="355" width="220" height="64" rx="9" fill="#ffffff" stroke="#9333ea" stroke-width="1.8"/>
<text x="200.0" y="382" text-anchor="middle" class="node-title">OIDC / OAuth IdP</text>
<text x="200.0" y="402" text-anchor="middle" class="node-sub">认证、同意、Token 签发与撤销</text>
<rect x="490" y="165" width="220" height="64" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
<text x="600.0" y="192" text-anchor="middle" class="node-title">Agent BFF / Session</text>
<text x="600.0" y="212" text-anchor="middle" class="node-sub">验证 ID Token；服务端保存会话</text>
<rect x="490" y="285" width="220" height="64" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
<text x="600.0" y="312" text-anchor="middle" class="node-title">LLM / Planner</text>
<text x="600.0" y="332" text-anchor="middle" class="node-sub">只输出结构化 Tool Intent</text>
<rect x="490" y="405" width="220" height="64" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
<text x="600.0" y="432" text-anchor="middle" class="node-title">Token Broker + Policy</text>
<text x="600.0" y="452" text-anchor="middle" class="node-sub">Token Exchange；RBAC/ABAC/Scope</text>
<rect x="490" y="525" width="220" height="64" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
<text x="600.0" y="552" text-anchor="middle" class="node-title">HITL</text>
<text x="600.0" y="572" text-anchor="middle" class="node-sub">step-up、预览差异、一次性确认</text>
<rect x="890" y="165" width="220" height="64" rx="9" fill="#ffffff" stroke="#9333ea" stroke-width="1.8"/>
<text x="1000.0" y="192" text-anchor="middle" class="node-title">Secret Vault</text>
<text x="1000.0" y="212" text-anchor="middle" class="node-sub">轮换密钥；短期凭证注入</text>
<rect x="890" y="285" width="220" height="64" rx="9" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
<text x="1000.0" y="312" text-anchor="middle" class="node-title">Tool Gateway</text>
<text x="1000.0" y="332" text-anchor="middle" class="node-sub">Schema、幂等、超时、策略执行</text>
<rect x="890" y="405" width="220" height="64" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
<text x="1000.0" y="432" text-anchor="middle" class="node-title">Resource Server</text>
<text x="1000.0" y="452" text-anchor="middle" class="node-sub">校验 aud/scope/sub/act/tenant</text>
<rect x="890" y="525" width="220" height="64" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
<text x="1000.0" y="552" text-anchor="middle" class="node-title">Audit Store</text>
<text x="1000.0" y="572" text-anchor="middle" class="node-sub">主体、意图、决策、调用和结果</text>
<path d="M200 249 V355" class="edge" stroke="#9333ea" marker-end="url(#arrow-purple)"/>
<path d="M310 387 H400 V197 H490" class="edge" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
<path d="M600 229 V285" class="edge" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
<path d="M600 349 V405" class="edge" stroke="#ea580c" marker-end="url(#arrow-orange)"/>
<path d="M600 469 V525" class="edge" stroke="#dc2626" marker-end="url(#arrow-red)"/>
<path d="M710 317 H890" class="edge" stroke="#ea580c" marker-end="url(#arrow-orange)"/>
<path d="M890 197 H800 V317 H890" class="edge" stroke="#9333ea" marker-end="url(#arrow-purple)"/>
<path d="M1000 349 V405" class="edge" stroke="#16a34a" marker-end="url(#arrow-green)"/>
<path d="M1000 469 V525" class="edge" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
<path d="M710 437 H890" class="edge" stroke="#dc2626" marker-end="url(#arrow-red)"/>
<rect x="159.0" y="292" width="112" height="19" rx="5" fill="#ffffff" opacity="0.96"/>
<text x="215" y="305" text-anchor="middle" class="edge-label">Auth Code + PKCE</text>
<rect x="339.0" y="355" width="112" height="19" rx="5" fill="#ffffff" opacity="0.96"/>
<text x="395" y="368" text-anchor="middle" class="edge-label">ID Token / grant</text>
<rect x="578.0" y="257" width="68" height="19" rx="5" fill="#ffffff" opacity="0.96"/>
<text x="612" y="270" text-anchor="middle" class="edge-label">脱敏上下文</text>
<rect x="573.5" y="377" width="77" height="19" rx="5" fill="#ffffff" opacity="0.96"/>
<text x="612" y="390" text-anchor="middle" class="edge-label">Tool Intent</text>
<rect x="578.0" y="497" width="68" height="19" rx="5" fill="#ffffff" opacity="0.96"/>
<text x="612" y="510" text-anchor="middle" class="edge-label">高风险确认</text>
<rect x="744.0" y="292" width="112" height="19" rx="5" fill="#ffffff" opacity="0.96"/>
<text x="800" y="305" text-anchor="middle" class="edge-label">intent + subject</text>
<rect x="771.0" y="172" width="68" height="19" rx="5" fill="#ffffff" opacity="0.96"/>
<text x="805" y="185" text-anchor="middle" class="edge-label">短期 Secret</text>
<rect x="949.0" y="379" width="126" height="19" rx="5" fill="#ffffff" opacity="0.96"/>
<text x="1012" y="392" text-anchor="middle" class="edge-label">sender-bound token</text>
<rect x="956.0" y="499" width="112" height="19" rx="5" fill="#ffffff" opacity="0.96"/>
<text x="1012" y="512" text-anchor="middle" class="edge-label">result + receipt</text>
<rect x="730.0" y="412" width="140" height="19" rx="5" fill="#ffffff" opacity="0.96"/>
<text x="800" y="425" text-anchor="middle" class="edge-label">Permit + constraints</text>
<g transform="translate(55 675)">
<line x1="0" y1="8" x2="30" y2="8" stroke="#2563eb" stroke-width="2.2"/>
<text x="38" y="12" class="legend">登录/资源数据</text>
<line x1="205" y1="8" x2="235" y2="8" stroke="#9333ea" stroke-width="2.2"/>
<text x="243" y="12" class="legend">身份与 Secret</text>
<line x1="410" y1="8" x2="440" y2="8" stroke="#ea580c" stroke-width="2.2"/>
<text x="448" y="12" class="legend">模型意图</text>
<line x1="615" y1="8" x2="645" y2="8" stroke="#dc2626" stroke-width="2.2"/>
<text x="653" y="12" class="legend">策略与审批</text>
<line x1="820" y1="8" x2="850" y2="8" stroke="#16a34a" stroke-width="2.2"/>
<text x="858" y="12" class="legend">授权执行</text>
</g>
<text x="55" y="735" class="sub">模型决定意图，策略系统决定权限，工具网关执行动作；任何自然语言都不能提升权限。</text>
</svg>
