<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif;fill:#111827}.title{font-size:25px;font-weight:700}.subtitle{font-size:13px;fill:#64748b}.node{font-size:14px;font-weight:650}.detail{font-size:11px;fill:#64748b}.label{font-size:11px;fill:#475569}.section{font-size:12px;font-weight:700}.metric{font-size:13px;font-weight:700}</style>
