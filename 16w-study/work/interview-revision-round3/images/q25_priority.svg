<path data-graph-role="edge" d="M535,420 L465,420" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
<rect x="476.0" y="391" width="48" height="19" rx="4" fill="#ffffff" opacity="0.96"/>
