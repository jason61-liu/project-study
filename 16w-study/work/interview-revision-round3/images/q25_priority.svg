<text x="48" y="68" class="subtitle">先判断结果是否已发生，再判断能否重试；退避不能替代幂等与查账</text>
<path data-graph-role="edge" d="M240,154 L315,154" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<path data-graph-role="edge" d="M475,154 L535,154" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
