<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1050" width="1200" height="1050">
  <style>
    text { font-family:'Hiragino Sans GB','Heiti SC','Arial Unicode MS',Menlo,monospace; fill:#e2e8f0; }
    .title{font-size:28px;font-weight:700}.subtitle{font-size:14px;fill:#94a3b8}.section{font-size:18px;font-weight:700}
    .label{font-size:14px;font-weight:700}.small{font-size:12px;fill:#94a3b8}.mono{font-size:13px;fill:#cbd5e1}.step{font-size:12px;fill:#10b981;font-weight:700}
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f0f1a"/><stop offset="100%" stop-color="#1a1a2e"/></linearGradient>
    <marker id="blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3b82f6"/></marker>
    <marker id="orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#f97316"/></marker>
  </defs>
  <rect width="1200" height="1050" fill="url(#bg)"/>
  <text x="55" y="52" class="title">现代 Decoder Block：Pre-RMSNorm + MHA + SwiGLU</text>
  <text x="55" y="79" class="subtitle">主干形状始终保持 [B,T,D]；Attention 临时创建位置路由矩阵，FFN 临时扩展通道</text>

  <rect data-graph-role="decoration" x="45" y="110" width="760" height="875" rx="8" fill="#0f172a" stroke="#334155"/>
  <rect data-graph-role="decoration" x="835" y="110" width="320" height="875" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="75" y="150" class="section">数据流 / Residual Stream</text>
  <text x="865" y="150" class="section">形状账本 / Shape Ledger</text>

  <!-- main vertical edges -->
  <path d="M425 205 V245" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M425 305 V345" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M425 415 V455" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M425 525 V555" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M425 630 V665" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M425 725 V765" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M425 825 V865" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#blue)"/>
  <path d="M425 925 V945" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#blue)"/>
  <!-- residual rails -->
  <path d="M300 185 H185 V695 H395" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#orange)"/>
  <path d="M395 695 H235 V975 H395" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#orange)"/>
  <text x="155" y="390" class="small" transform="rotate(-90 155 390)">Residual #1 / 恒等路径</text>
  <text x="205" y="775" class="small" transform="rotate(-90 205 775)">Residual #2 / 恒等路径</text>

  <!-- main nodes -->
  <rect x="300" y="165" width="250" height="40" rx="6" fill="#111827" stroke="#475569"/>
  <text x="320" y="190" class="step">01</text><text x="425" y="190" text-anchor="middle" class="label">输入 X</text><text x="530" y="190" text-anchor="end" class="mono">[B,T,D]</text>
  <rect x="330" y="245" width="190" height="60" rx="6" fill="#1e1b4b" stroke="#a855f7"/>
  <text x="350" y="270" class="step">02</text><text x="425" y="270" text-anchor="middle" class="label">RMSNorm</text><text x="425" y="292" text-anchor="middle" class="small">逐 token 沿 D 缩放</text>
  <rect x="285" y="345" width="280" height="70" rx="6" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="305" y="373" class="step">03</text><text x="425" y="373" text-anchor="middle" class="label">Q / K / V 投影 + 拆 Head</text>
  <text x="425" y="398" text-anchor="middle" class="mono">[B,H,T,D_k] / [B,H,T,D_v]</text>
  <rect x="285" y="455" width="280" height="70" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="305" y="475" class="step">04-05</text><text x="425" y="496" text-anchor="middle" class="label">QK^T / √D_k + Mask → Softmax</text>
  <text x="425" y="518" text-anchor="middle" class="mono">Attention Weight [B,H,T,T]</text>
  <rect x="285" y="555" width="280" height="75" rx="6" fill="#052e16" stroke="#10b981"/>
  <text x="305" y="575" class="step">06-08</text><text x="425" y="602" text-anchor="middle" class="label">A · V → Concat → W_O</text>
  <text x="425" y="622" text-anchor="middle" class="mono">回到 [B,T,D]</text>
  <circle cx="425" cy="695" r="30" fill="#1c1917" stroke="#f97316" stroke-width="2"/>
  <text x="425" y="701" text-anchor="middle" class="label">＋</text><text x="465" y="701" class="small">残差 #1</text>
  <rect x="330" y="765" width="190" height="60" rx="6" fill="#1e1b4b" stroke="#a855f7"/>
  <text x="350" y="790" class="step">10</text><text x="425" y="790" text-anchor="middle" class="label">RMSNorm</text><text x="425" y="812" text-anchor="middle" class="mono">[B,T,D]</text>
  <rect x="285" y="865" width="280" height="60" rx="6" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="305" y="892" class="step">11–12</text><text x="425" y="892" text-anchor="middle" class="label">SwiGLU → W_down</text>
  <text x="425" y="914" text-anchor="middle" class="mono">D → D_ff → D</text>
  <circle cx="425" cy="975" r="30" fill="#1c1917" stroke="#f97316" stroke-width="2"/>
  <text x="425" y="981" text-anchor="middle" class="label">＋</text><text x="465" y="981" class="small">残差 #2 → 输出</text>

  <!-- side detail callouts -->
  <rect x="600" y="245" width="170" height="170" rx="6" fill="#111827" stroke="#475569"/>
  <text x="685" y="273" text-anchor="middle" class="label">Attention 做什么？</text>
  <text x="620" y="305" class="small">• 混合 token 位置</text>
  <text x="620" y="333" class="small">• 每个 Head 独立匹配</text>
  <text x="620" y="361" class="small">• Softmax 沿 T_k</text>
  <text x="620" y="389" class="small">• W_O 混合 Head</text>
  <rect x="600" y="745" width="170" height="170" rx="6" fill="#111827" stroke="#475569"/>
  <text x="685" y="773" text-anchor="middle" class="label">FFN 做什么？</text>
  <text x="620" y="805" class="small">• 逐 token 独立</text>
  <text x="620" y="833" class="small">• 混合隐藏通道</text>
  <text x="620" y="861" class="small">• 门控候选特征</text>
  <text x="620" y="889" class="small">• 下投影回 D</text>

  <!-- ledger -->
  <rect x="860" y="180" width="270" height="110" rx="6" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="880" y="210" class="label">残差主干</text>
  <text x="995" y="245" text-anchor="middle" class="mono">[B,T,D]</text>
  <text x="880" y="272" class="small">贯穿 Block，形状不变</text>

  <rect x="860" y="315" width="270" height="130" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="880" y="345" class="label">位置路由矩阵</text>
  <text x="995" y="382" text-anchor="middle" class="mono">[B,H,T_q,T_k]</text>
  <text x="880" y="414" class="small">每个 Query 对全部 Key 的权重</text>

  <rect x="860" y="470" width="270" height="130" rx="6" fill="#1e1b4b" stroke="#a855f7"/>
  <text x="880" y="500" class="label">Head 内部表示</text>
  <text x="995" y="537" text-anchor="middle" class="mono">[B,H,T,D_k / D_v]</text>
  <text x="880" y="569" class="small">H 个并行子空间</text>

  <rect x="860" y="625" width="270" height="130" rx="6" fill="#052e16" stroke="#10b981"/>
  <text x="880" y="655" class="label">FFN 中间表示</text>
  <text x="995" y="692" text-anchor="middle" class="mono">[B,T,D_ff]</text>
  <text x="880" y="724" class="small">只临时扩展通道，不混合 token</text>

  <rect x="860" y="790" width="270" height="150" rx="6" fill="#111827" stroke="#475569"/>
  <text x="880" y="820" class="label">记忆口诀</text>
  <text x="880" y="854" class="small">Attention：位置之间路由</text>
  <text x="880" y="884" class="small">FFN：token 内部加工</text>
  <text x="880" y="914" class="small">Residual：维持 D 维主干</text>
</svg>
