<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="header-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="header-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="header-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.7" opacity="0.18"/>
    </pattern>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'Hiragino Sans GB','Heiti SC','Microsoft YaHei','SF Mono','Fira Code',monospace; fill:#e2e8f0; }
    .title { font-size:36px; font-weight:700; letter-spacing:1px; }
    .subtitle { font-size:17px; fill:#94a3b8; }
    .col-title { font-size:25px; font-weight:700; }
    .col-sub { font-size:14px; fill:#cbd5e1; }
    .row-label { font-size:17px; font-weight:700; letter-spacing:1px; }
    .metric { font-size:17px; font-weight:700; }
    .body { font-size:14px; fill:#cbd5e1; }
    .small { font-size:12px; fill:#94a3b8; }
    .mono { font-family:'SF Mono','Fira Code','Hiragino Sans GB','Heiti SC',monospace; }
    .chip { font-size:12px; font-weight:700; }
  </style>

  <rect width="1800" height="1250" fill="url(#bg-grad)" data-graph-role="decoration"/>
  <rect width="1800" height="1250" fill="url(#grid)" data-graph-role="decoration"/>

  <text x="900" y="58" text-anchor="middle" class="title">长上下文注意力架构：状态大小 × 计算 × 表达能力</text>
  <text x="900" y="91" text-anchor="middle" class="subtitle">MHA / GQA、DeepSeek-V3 MLA 与 Kimi Linear 3:1 KDA/MLA 混合架构</text>
  <rect x="540" y="111" width="720" height="30" rx="15" fill="#0f172a" stroke="#334155" data-graph-role="decoration"/>
  <text x="900" y="132" text-anchor="middle" class="small">比较口径：单层主要推理状态；T = 上下文长度；忽略 batch、层数、dtype 字节数与实现附加缓冲区</text>

  <!-- Column headers -->
  <g data-graph-role="node" data-node-id="mha-gqa-header">
    <rect x="60" y="175" width="500" height="118" rx="8" fill="url(#header-blue)" stroke="#3b82f6" stroke-width="1.8"/>
    <rect x="60" y="175" width="8" height="118" rx="4" fill="#3b82f6"/>
    <text x="92" y="214" class="col-title">MHA / GQA</text>
    <text x="92" y="242" class="col-sub">逐 token K/V + 全局 Softmax</text>
    <rect x="92" y="257" width="182" height="24" rx="12" fill="#1d4ed8" opacity="0.42"/>
    <text x="183" y="274" text-anchor="middle" class="chip">GQA 共享 K/V heads</text>
  </g>
  <g data-graph-role="node" data-node-id="mla-header">
    <rect x="650" y="175" width="500" height="118" rx="8" fill="url(#header-purple)" stroke="#a855f7" stroke-width="1.8"/>
    <rect x="650" y="175" width="8" height="118" rx="4" fill="#a855f7"/>
    <text x="682" y="214" class="col-title">MLA</text>
    <text x="682" y="242" class="col-sub">低秩 KV 潜变量 + 全局 Softmax</text>
    <rect x="682" y="257" width="214" height="24" rx="12" fill="#7c3aed" opacity="0.42"/>
    <text x="789" y="274" text-anchor="middle" class="chip">DeepSeek-V3 配置</text>
  </g>
  <g data-graph-role="node" data-node-id="kimi-header">
    <rect x="1240" y="175" width="500" height="118" rx="8" fill="url(#header-green)" stroke="#10b981" stroke-width="1.8"/>
    <rect x="1240" y="175" width="8" height="118" rx="4" fill="#10b981"/>
    <text x="1272" y="214" class="col-title">Kimi Linear 混合</text>
    <text x="1272" y="242" class="col-sub">3 KDA 层 : 1 MLA 层</text>
    <rect x="1272" y="257" width="250" height="24" rx="12" fill="#059669" opacity="0.42"/>
    <text x="1397" y="274" text-anchor="middle" class="chip">固定状态 + 周期性全局检索</text>
  </g>

  <!-- State row -->
  <text x="60" y="332" class="row-label" fill="#eab308">01 / 状态大小</text>
  <g data-graph-role="node" data-node-id="mha-state">
    <rect x="60" y="350" width="500" height="208" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="88" y="385" class="metric" fill="#60a5fa">MHA: 2T H_q d_h</text>
    <text x="88" y="414" class="metric" fill="#93c5fd">GQA: 2T H_kv d_h</text>
    <text x="88" y="445" class="body">都随 T 线性增长；GQA 只降低斜率</text>
    <line x1="90" y1="520" x2="520" y2="520" stroke="#475569"/>
    <line x1="90" y1="520" x2="90" y2="468" stroke="#475569"/>
    <path d="M 90 516 L 510 468" fill="none" stroke="#3b82f6" stroke-width="4" filter="url(#glow-blue)" data-graph-role="decoration"/>
    <path d="M 90 516 L 510 492" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="8 6" data-graph-role="decoration"/>
    <text x="515" y="463" text-anchor="end" class="small" fill="#60a5fa">MHA</text>
    <text x="515" y="489" text-anchor="end" class="small" fill="#93c5fd">GQA</text>
  </g>
  <g data-graph-role="node" data-node-id="mla-state">
    <rect x="650" y="350" width="500" height="208" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="678" y="385" class="metric" fill="#c084fc">T(d_c + d_h^R)</text>
    <text x="678" y="414" class="metric" fill="#e9d5ff">= T(512 + 64) = 576T</text>
    <text x="678" y="445" class="body">缓存压缩 KV 潜变量 c_KV 与 RoPE key k_R</text>
    <line x1="680" y1="520" x2="1110" y2="520" stroke="#475569"/>
    <line x1="680" y1="520" x2="680" y2="468" stroke="#475569"/>
    <path d="M 680 516 L 1100 492" fill="none" stroke="#a855f7" stroke-width="4" filter="url(#glow-purple)" data-graph-role="decoration"/>
    <text x="1105" y="487" text-anchor="end" class="small" fill="#c084fc">线性增长，小斜率</text>
  </g>
  <g data-graph-role="node" data-node-id="kimi-state">
    <rect x="1240" y="350" width="500" height="208" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="1268" y="385" class="metric" fill="#34d399">KDA 层：每头 d_k × d_v</text>
    <text x="1268" y="414" class="metric" fill="#a7f3d0">= 128 × 128，固定状态</text>
    <text x="1268" y="445" class="body">整网仍含约 1/4 MLA 层，状态仍随 T 增长</text>
    <line x1="1270" y1="520" x2="1700" y2="520" stroke="#475569"/>
    <line x1="1270" y1="520" x2="1270" y2="468" stroke="#475569"/>
    <path d="M 1270 500 L 1690 500" fill="none" stroke="#10b981" stroke-width="4" filter="url(#glow-green)" data-graph-role="decoration"/>
    <path d="M 1270 516 L 1690 490" fill="none" stroke="#eab308" stroke-width="3" stroke-dasharray="8 6" data-graph-role="decoration"/>
    <text x="1695" y="496" text-anchor="end" class="small" fill="#34d399">纯 KDA</text>
    <text x="1695" y="485" text-anchor="end" class="small" fill="#fde047">3:1 混合整网</text>
  </g>

  <!-- Compute row -->
  <text x="60" y="602" class="row-label" fill="#eab308">02 / 计算随上下文增长</text>
  <g data-graph-role="node" data-node-id="mha-compute">
    <rect x="60" y="620" width="500" height="188" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="88" y="657" class="metric" fill="#60a5fa">Prefill: Θ(T^2 H_q d_h)</text>
    <text x="88" y="690" class="metric" fill="#93c5fd">Decode / token: Θ(T H_q d_h)</text>
    <text x="88" y="728" class="body">GQA 降低 KV 读取带宽</text>
    <text x="88" y="754" class="body">但每个 query head 仍扫描全部 T 个位置</text>
    <rect x="88" y="772" width="222" height="22" rx="11" fill="#1d4ed8" opacity="0.34"/>
    <text x="199" y="787" text-anchor="middle" class="small">全局 Softmax：二次 / 线性扫描</text>
  </g>
  <g data-graph-role="node" data-node-id="mla-compute">
    <rect x="650" y="620" width="500" height="188" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="678" y="657" class="metric" fill="#c084fc">Prefill: 仍含 Θ(T^2)</text>
    <text x="678" y="690" class="metric" fill="#e9d5ff">Decode / token: 仍含 Θ(T)</text>
    <text x="678" y="728" class="body">Softmax 仍覆盖所有历史 token</text>
    <text x="678" y="754" class="body">收益主要来自缓存压缩与更低状态带宽</text>
    <rect x="678" y="772" width="239" height="22" rx="11" fill="#7c3aed" opacity="0.34"/>
    <text x="797" y="787" text-anchor="middle" class="small">不是线性注意力，不改变渐近阶数</text>
  </g>
  <g data-graph-role="node" data-node-id="kimi-compute">
    <rect x="1240" y="620" width="500" height="188" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="1268" y="657" class="metric" fill="#34d399">KDA prefill: Θ(T)</text>
    <text x="1268" y="690" class="metric" fill="#a7f3d0">KDA decode / token: Θ(1) in T</text>
    <text x="1268" y="728" class="body">但 3:1 整网仍含周期性 MLA 的 T^2 / T 项</text>
    <text x="1268" y="754" class="body">更准确：压低全局注意力层占比和常数</text>
    <rect x="1268" y="772" width="250" height="22" rx="11" fill="#059669" opacity="0.34"/>
    <text x="1393" y="787" text-anchor="middle" class="small">不要把单层性质外推为整网性质</text>
  </g>

  <!-- Expressiveness row -->
  <text x="60" y="852" class="row-label" fill="#eab308">03 / 信息访问与表达能力</text>
  <g data-graph-role="node" data-node-id="mha-expression">
    <rect x="60" y="870" width="500" height="230" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="88" y="907" class="metric" fill="#60a5fa">显式逐 token 全局检索</text>
    <text x="88" y="941" class="body">MHA：每个 query head 拥有独立 K/V</text>
    <text x="88" y="969" class="body">GQA：query 组内共享 K/V，表示自由度降低</text>
    <line x1="88" y1="992" x2="532" y2="992" stroke="#334155"/>
    <text x="88" y="1022" class="body">GQA 论文：质量接近 MHA，速度接近 MQA</text>
    <text x="88" y="1050" class="small">实验结论，不是任意模型上的质量保证</text>
    <rect x="88" y="1065" width="132" height="22" rx="11" fill="#1d4ed8" opacity="0.34"/>
    <text x="154" y="1080" text-anchor="middle" class="small">访问精度：高</text>
  </g>
  <g data-graph-role="node" data-node-id="mla-expression">
    <rect x="650" y="870" width="500" height="230" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="678" y="907" class="metric" fill="#c084fc">压缩表示上的逐 token Softmax</text>
    <text x="678" y="941" class="body">保留对任意历史位置的显式选择</text>
    <text x="678" y="969" class="body">K/V 先经过联合低秩潜变量瓶颈</text>
    <line x1="678" y1="992" x2="1122" y2="992" stroke="#334155"/>
    <text x="678" y="1022" class="body">DeepSeek-V3 报告：性能可与标准 MHA 相当</text>
    <text x="678" y="1050" class="small">MLA 优势重点是状态与带宽，不是取消全局访问</text>
    <rect x="678" y="1065" width="184" height="22" rx="11" fill="#7c3aed" opacity="0.34"/>
    <text x="770" y="1080" text-anchor="middle" class="small">访问精度：高 + 压缩</text>
  </g>
  <g data-graph-role="node" data-node-id="kimi-expression">
    <rect x="1240" y="870" width="500" height="230" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="1268" y="907" class="metric" fill="#34d399">有限状态记忆 + 周期性全局检索</text>
    <text x="1268" y="941" class="body">KDA：细粒度对角遗忘门 + delta rule</text>
    <text x="1268" y="969" class="body">固定容量更难处理极端长程精确复制/细粒度选择</text>
    <line x1="1268" y1="992" x2="1712" y2="992" stroke="#334155"/>
    <text x="1268" y="1022" class="body">周期性 MLA 恢复显式全局 token 访问</text>
    <text x="1268" y="1050" class="small">论文同配方实验优于 full MLA；不能外推为普遍定理</text>
    <rect x="1268" y="1065" width="242" height="22" rx="11" fill="#059669" opacity="0.34"/>
    <text x="1389" y="1080" text-anchor="middle" class="small">效率与精确访问的结构性折中</text>
  </g>

  <!-- Bottom clarification -->
  <rect x="60" y="1130" width="1680" height="82" rx="8" fill="#1c1917" stroke="#f97316" stroke-width="1.4" data-graph-role="node" data-node-id="moe-note"/>
  <rect x="60" y="1130" width="8" height="82" rx="4" fill="#f97316"/>
  <text x="88" y="1161" class="metric" fill="#fb923c">注意：MLA / KDA 解决 token mixing；MoE 解决 channel mixing</text>
  <text x="88" y="1191" class="body">DeepSeek-V3 的 DeepSeekMoE 与 Kimi Linear 的 MoE 层控制专家稀疏激活；它们不等价于 attention 状态压缩，也不会自动缩小 KV Cache。</text>

  <text x="60" y="1235" class="small">依据：DeepSeek-V3 Technical Report (2024) · Kimi Linear Technical Report (2025) · GQA (EMNLP 2023) · 公式为按论文架构定义推导</text>
  <text x="1740" y="1235" text-anchor="end" class="small" fill="#475569">dark-terminal / verified comparison</text>
</svg>
