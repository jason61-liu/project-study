<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860">
<style>
text{font-family:"Arial Unicode MS","Hiragino Sans GB","Heiti SC","Helvetica Neue",Arial,sans-serif}.ttl{font-family:"Songti SC","Arial Unicode MS",Georgia,serif;font-size:30px;font-weight:700;fill:#f5f0eb}.sub{font-size:13px;fill:#a39787}.sec{font-family:"Songti SC","Arial Unicode MS",Georgia,serif;font-size:15px;font-weight:700;fill:#c9a96e}.nm{font-size:15px;font-weight:650;fill:#f5f0eb}.sm{font-size:11px;fill:#a39787}.xs{font-size:10px;fill:#6b5f53}.al{font-size:11px;fill:#c9b8a0}.mono{font-family:"Arial Unicode MS","SF Mono","Courier New",monospace;font-size:11px;fill:#d7c6b5}</style>
<defs>
<marker id="arr-gold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#d4a574"/></marker>
<marker id="arr-mint" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6ee7b7"/></marker>
<marker id="arr-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fdba74"/></marker>
<marker id="arr-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/></marker>
<marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#38bdf8"/></marker>
<marker id="arr-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f87171"/></marker>
<marker id="arr-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
<marker id="arr-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fbbf24"/></marker>
<radialGradient id="glow"><stop offset="0" stop-color="#d4a574" stop-opacity=".07"/><stop offset="1" stop-color="#d4a574" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1400" height="860" fill="#0a0a0a"/>
<ellipse cx="700" cy="400" rx="620" ry="340" fill="url(#glow)" data-graph-role="decoration" data-owner="canvas"/>
<text x="700" y="48" text-anchor="middle" class="ttl">串行、并行与多 Agent：性能收益和协调税</text>
<text x="700" y="74" text-anchor="middle" class="sub">并行只压缩无依赖关键路径；多 Agent 额外支付 Context、调度、聚合和恢复成本</text>
<rect x="35" y="105" width="420" height="580" rx="10" fill="#0e0e0e" stroke="#38bdf8" stroke-width="1" stroke-dasharray="7 5"/>
<text x="53" y="133" class="sec" fill="#38bdf8">SERIAL · STRONG DEPENDENCY</text>
<rect x="105" y="155" width="280" height="66" rx="8" fill="#111111" stroke="#38bdf8" stroke-width="1.7"/>
<text x="245.0" y="184" text-anchor="middle" class="nm" fill="#38bdf8">A · Retrieve</text>
<text x="245.0" y="206" text-anchor="middle" class="sm">L = sum(L_i) · P ≈ prod(p_i)</text>
<path d="M245 221 V270" fill="none" stroke="#38bdf8" stroke-width="2.0" marker-end="url(#arr-blue)"/>
<rect x="105" y="270" width="280" height="66" rx="8" fill="#111111" stroke="#38bdf8" stroke-width="1.7"/>
<text x="245.0" y="299" text-anchor="middle" class="nm" fill="#38bdf8">B · Analyze</text>
<text x="245.0" y="321" text-anchor="middle" class="sm">L = sum(L_i) · P ≈ prod(p_i)</text>
<path d="M245 336 V385" fill="none" stroke="#38bdf8" stroke-width="2.0" marker-end="url(#arr-blue)"/>
<rect x="105" y="385" width="280" height="66" rx="8" fill="#111111" stroke="#38bdf8" stroke-width="1.7"/>
<text x="245.0" y="414" text-anchor="middle" class="nm" fill="#38bdf8">C · Verify</text>
<text x="245.0" y="436" text-anchor="middle" class="sm">L = sum(L_i) · P ≈ prod(p_i)</text>
<path d="M245 451 V500" fill="none" stroke="#38bdf8" stroke-width="2.0" marker-end="url(#arr-blue)"/>
<rect x="105" y="500" width="280" height="66" rx="8" fill="#111111" stroke="#f87171" stroke-width="1.7"/>
<text x="245.0" y="529" text-anchor="middle" class="nm" fill="#f87171">D · Publish</text>
<text x="245.0" y="551" text-anchor="middle" class="sm">L = sum(L_i) · P ≈ prod(p_i)</text>
<rect x="490" y="105" width="420" height="580" rx="10" fill="#0e0e0e" stroke="#6ee7b7" stroke-width="1" stroke-dasharray="7 5"/>
<text x="508" y="133" class="sec" fill="#6ee7b7">PARALLEL · INDEPENDENT WORK</text>
<rect x="580" y="155" width="240" height="66" rx="8" fill="#111111" stroke="#d4a574" stroke-width="1.7"/>
<text x="700.0" y="184" text-anchor="middle" class="nm" fill="#d4a574">Fan-out</text>
<text x="700.0" y="206" text-anchor="middle" class="sm">dependency check first</text>
<rect x="525" y="310" width="135" height="66" rx="8" fill="#111111" stroke="#6ee7b7" stroke-width="1.7"/>
<text x="592.5" y="339" text-anchor="middle" class="nm" fill="#6ee7b7">Worker A</text>
<text x="592.5" y="361" text-anchor="middle" class="sm">isolated</text>
<rect x="680" y="310" width="135" height="66" rx="8" fill="#111111" stroke="#6ee7b7" stroke-width="1.7"/>
<text x="747.5" y="339" text-anchor="middle" class="nm" fill="#6ee7b7">Worker B</text>
<text x="747.5" y="361" text-anchor="middle" class="sm">isolated</text>
<path d="M700 221 V270 H592 V310" fill="none" stroke="#6ee7b7" stroke-width="2.0" marker-end="url(#arr-mint)"/>
<path d="M700 221 V270 H747 V310" fill="none" stroke="#6ee7b7" stroke-width="2.0" marker-end="url(#arr-mint)"/>
<rect x="580" y="465" width="240" height="76" rx="8" fill="#111111" stroke="#fdba74" stroke-width="1.7"/>
<text x="700.0" y="494" text-anchor="middle" class="nm" fill="#fdba74">Aggregator</text>
<text x="700.0" y="516" text-anchor="middle" class="sm">conflict · partial · lineage</text>
<path d="M592 376 V425 H660 V465" fill="none" stroke="#fdba74" stroke-width="2.0" marker-end="url(#arr-orange)"/>
<path d="M747 376 V425 H740 V465" fill="none" stroke="#fdba74" stroke-width="2.0" marker-end="url(#arr-orange)"/>
<text x="700" y="580" text-anchor="middle" class="mono">L ≈ max(L_i) + L_agg</text>
<text x="700" y="606" text-anchor="middle" class="mono">C ≈ sum(C_i) + C_coord</text>
<rect x="945" y="105" width="420" height="580" rx="10" fill="#0e0e0e" stroke="#f87171" stroke-width="1" stroke-dasharray="7 5"/>
<text x="963" y="133" class="sec" fill="#f87171">MULTI-AGENT · COORDINATION TAX</text>
<rect x="985" y="150" width="340" height="66" rx="8" fill="#111111" stroke="#a78bfa" stroke-width="1.7"/>
<text x="1155.0" y="179" text-anchor="middle" class="nm" fill="#a78bfa">Context Duplication</text>
<text x="1155.0" y="201" text-anchor="middle" class="sm">N × system/tools/history</text>
<rect x="985" y="248" width="340" height="66" rx="8" fill="#111111" stroke="#fbbf24" stroke-width="1.7"/>
<text x="1155.0" y="277" text-anchor="middle" class="nm" fill="#fbbf24">Scheduling</text>
<text x="1155.0" y="299" text-anchor="middle" class="sm">queue · priority · backpressure</text>
<rect x="985" y="346" width="340" height="66" rx="8" fill="#111111" stroke="#f87171" stroke-width="1.7"/>
<text x="1155.0" y="375" text-anchor="middle" class="nm" fill="#f87171">Error Propagation</text>
<text x="1155.0" y="397" text-anchor="middle" class="sm">decompose → worker → aggregate</text>
<rect x="985" y="444" width="340" height="66" rx="8" fill="#111111" stroke="#38bdf8" stroke-width="1.7"/>
<text x="1155.0" y="473" text-anchor="middle" class="nm" fill="#38bdf8">Cancellation</text>
<text x="1155.0" y="495" text-anchor="middle" class="sm">parent → workers → tools</text>
<rect x="985" y="542" width="340" height="66" rx="8" fill="#111111" stroke="#6ee7b7" stroke-width="1.7"/>
<text x="1155.0" y="571" text-anchor="middle" class="nm" fill="#6ee7b7">Recovery</text>
<text x="1155.0" y="593" text-anchor="middle" class="sm">partial commit · replay · merge</text>
<rect x="85" y="715" width="1230" height="66" rx="9" fill="#1a1a1a" stroke="#d4a574"/>
<text x="700" y="742" text-anchor="middle" class="sm">并行收益条件：saved critical-path latency &gt; fan-out + queue + aggregate + retry overhead</text>
<text x="700" y="764" text-anchor="middle" class="xs">默认单控制器；只有独立性、隔离或专业化收益被实验验证后才升级多 Agent</text>
<line x1="65" y1="824" x2="99" y2="824" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="111" y="828" text-anchor="start" class="sm">串行依赖</text>
<line x1="300" y1="824" x2="334" y2="824" stroke="#6ee7b7" stroke-width="2" marker-end="url(#arr-mint)"/>
<text x="346" y="828" text-anchor="start" class="sm">并行执行</text>
<line x1="535" y1="824" x2="569" y2="824" stroke="#fdba74" stroke-width="2" marker-end="url(#arr-orange)"/>
<text x="581" y="828" text-anchor="start" class="sm">聚合</text>
<line x1="770" y1="824" x2="804" y2="824" stroke="#f87171" stroke-width="2" marker-end="url(#arr-rose)"/>
<text x="816" y="828" text-anchor="start" class="sm">错误/协调税</text>
</svg>