<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860">
<style>
text{font-family:"Arial Unicode MS","Hiragino Sans GB","Heiti SC","Helvetica Neue",Arial,sans-serif}.ttl{font-family:"Songti SC","Arial Unicode MS",Georgia,serif;font-size:30px;font-weight:700;fill:#f5f0eb}.sub{font-size:13px;fill:#a39787}.sec{font-family:"Songti SC","Arial Unicode MS",Georgia,serif;font-size:15px;font-weight:700;fill:#c9a96e}.nm{font-size:15px;font-weight:650;fill:#f5f0eb}.sm{font-size:11px;fill:#a39787}.xs{font-size:10px;fill:#6b5f53}.al{font-size:11px;fill:#c9b8a0}.mono{font-family:"Arial Unicode MS","SF Mono","Courier New",monospace;font-size:11px;fill:#d7c6b5}</style>
<defs>
<marker id="arr-gold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#d4a574"/></marker>
<marker id="arr-mint" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6ee7b7"/></marker>
<marker id="arr-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fdba74"/></marker>
<marker id="arr-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/></marker>
<marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#38bdf8"/></marker>
<marker id="arr-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#f87171"/></marker>
<marker id="arr-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
<marker id="arr-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fbbf24"/></marker>
<radialGradient id="glow"><stop offset="0" stop-color="#d4a574" stop-opacity=".07"/><stop offset="1" stop-color="#d4a574" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1400" height="860" fill="#0a0a0a"/>
<ellipse cx="700" cy="400" rx="620" ry="340" fill="url(#glow)" data-graph-role="decoration" data-owner="canvas"/>
<text x="700" y="48" text-anchor="middle" class="ttl">规划、恢复与任务编排：架构选择和消融证据</text>
<text x="700" y="74" text-anchor="middle" class="sub">先确定控制权与失败语义，再用配对实验判断多 Agent 的收益是否覆盖协调税</text>
<rect x="35" y="110" width="390" height="570" rx="10" fill="#0e0e0e" stroke="#38bdf8" stroke-width="1" stroke-dasharray="7 5"/>
<text x="53" y="138" class="sec" fill="#38bdf8">ARCHITECTURE ADOPTION</text>
<rect x="75" y="160" width="310" height="78" rx="8" fill="#111111" stroke="#38bdf8" stroke-width="1.7"/>
<rect x="79" y="164" width="302" height="70" rx="6" fill="none" stroke="#38bdf8" stroke-width=".6" opacity=".55"/>
<text x="230.0" y="189" text-anchor="middle" class="nm" fill="#38bdf8">Single Agent</text>
<text x="230.0" y="211" text-anchor="middle" class="sm">路径动态 · 工具有限 · 单一 owner</text>
<rect x="75" y="285" width="310" height="78" rx="8" fill="#111111" stroke="#6ee7b7" stroke-width="1.7"/>
<text x="230.0" y="314" text-anchor="middle" class="nm" fill="#6ee7b7">Workflow</text>
<text x="230.0" y="336" text-anchor="middle" class="sm">路径可枚举 · 硬门禁 · 强审计</text>
<rect x="75" y="410" width="310" height="78" rx="8" fill="#111111" stroke="#a78bfa" stroke-width="1.7"/>
<text x="230.0" y="439" text-anchor="middle" class="nm" fill="#a78bfa">Multi-Agent</text>
<text x="230.0" y="461" text-anchor="middle" class="sm">可独立并行 · 隔离/专业化收益</text>
<rect x="75" y="555" width="310" height="82" rx="8" fill="#1a1a1a" stroke="#f87171"/>
<text x="230" y="580" text-anchor="middle" class="nm">反例门禁</text>
<text x="230" y="605" text-anchor="middle" class="sm">稳定路径不用 Agent · 强依赖不并行</text>
<text x="230" y="625" text-anchor="middle" class="xs">无可测增益不升级多 Agent</text>
<rect x="455" y="110" width="500" height="570" rx="10" fill="#0e0e0e" stroke="#d4a574" stroke-width="1" stroke-dasharray="7 5"/>
<text x="473" y="138" class="sec" fill="#d4a574">CONTROL OWNERSHIP</text>
<text x="485" y="160" text-anchor="start" class="sec">MANAGER · retained ownership</text>
<rect x="485" y="190" width="180" height="76" rx="8" fill="#111111" stroke="#d4a574" stroke-width="1.7"/>
<rect x="489" y="194" width="172" height="68" rx="6" fill="none" stroke="#d4a574" stroke-width=".6" opacity=".55"/>
<text x="575.0" y="219" text-anchor="middle" class="nm" fill="#d4a574">Manager</text>
<text x="575.0" y="241" text-anchor="middle" class="sm">plan · delegate · merge</text>
<rect x="745" y="190" width="180" height="76" rx="8" fill="#111111" stroke="#a78bfa" stroke-width="1.7"/>
<text x="835.0" y="219" text-anchor="middle" class="nm" fill="#a78bfa">Specialist</text>
<text x="835.0" y="241" text-anchor="middle" class="sm">bounded artifact</text>
<path d="M665 218 H745" fill="none" stroke="#d4a574" stroke-width="2.0" marker-end="url(#arr-gold)"/>
<text x="705" y="207" text-anchor="middle" class="al">delegate</text>
<path d="M745 244 H665" fill="none" stroke="#6ee7b7" stroke-width="2.0" marker-end="url(#arr-mint)"/>
<text x="705" y="262" text-anchor="middle" class="al">return artifact</text>
<rect x="485" y="285" width="440" height="48" rx="7" fill="#1a1a1a" stroke="#d4a574"/>
<text x="705" y="315" text-anchor="middle" class="mono">conversation_owner = Manager</text>
<text x="485" y="390" text-anchor="start" class="sec">HANDOFF · transferred ownership</text>
<rect x="485" y="420" width="160" height="76" rx="8" fill="#111111" stroke="#38bdf8" stroke-width="1.7"/>
<text x="565.0" y="449" text-anchor="middle" class="nm" fill="#38bdf8">Agent A</text>
<text x="565.0" y="471" text-anchor="middle" class="sm">current owner</text>
<polygon points="705,420 755,458 705,496 655,458" fill="#111111" stroke="#fdba74" stroke-width="1.7"/>
<text x="705" y="454" text-anchor="middle" class="sm">accept</text>
<text x="705" y="471" text-anchor="middle" class="xs">gate</text>
<rect x="795" y="420" width="130" height="76" rx="8" fill="#111111" stroke="#f87171" stroke-width="1.7"/>
<rect x="799" y="424" width="122" height="68" rx="6" fill="none" stroke="#f87171" stroke-width=".6" opacity=".55"/>
<text x="860.0" y="449" text-anchor="middle" class="nm" fill="#f87171">Agent B</text>
<text x="860.0" y="471" text-anchor="middle" class="sm">new owner</text>
<path d="M645 458 H655" fill="none" stroke="#fdba74" stroke-width="2.0" marker-end="url(#arr-orange)"/>
<path d="M755 458 H795" fill="none" stroke="#f87171" stroke-width="2.0" marker-end="url(#arr-rose)"/>
<rect x="485" y="520" width="440" height="74" rx="7" fill="#1a1a1a" stroke="#f87171"/>
<text x="705" y="547" text-anchor="middle" class="mono">conversation_owner: A → B</text>
<text x="705" y="571" text-anchor="middle" class="xs">pending commitments · scope · deadline must transfer</text>
<rect x="985" y="110" width="380" height="570" rx="10" fill="#0e0e0e" stroke="#f87171" stroke-width="1" stroke-dasharray="7 5"/>
<text x="1003" y="138" class="sec" fill="#f87171">ABLATION EVIDENCE</text>
<rect x="1020" y="160" width="310" height="76" rx="8" fill="#111111" stroke="#6ee7b7" stroke-width="1.7"/>
<text x="1175.0" y="189" text-anchor="middle" class="nm" fill="#6ee7b7">Benefit</text>
<text x="1175.0" y="211" text-anchor="middle" class="sm">Δ success · recovery · quality</text>
<rect x="1020" y="280" width="310" height="76" rx="8" fill="#111111" stroke="#fdba74" stroke-width="1.7"/>
<text x="1175.0" y="309" text-anchor="middle" class="nm" fill="#fdba74">Cost</text>
<text x="1175.0" y="331" text-anchor="middle" class="sm">Δ token · latency · coordination</text>
<rect x="1020" y="400" width="310" height="76" rx="8" fill="#111111" stroke="#a78bfa" stroke-width="1.7"/>
<text x="1175.0" y="429" text-anchor="middle" class="nm" fill="#a78bfa">Variation</text>
<text x="1175.0" y="451" text-anchor="middle" class="sm">SD · p95 · paired 95% CI</text>
<rect x="1020" y="520" width="310" height="76" rx="8" fill="#111111" stroke="#d4a574" stroke-width="1.7"/>
<text x="1175.0" y="549" text-anchor="middle" class="nm" fill="#d4a574">Decision</text>
<text x="1175.0" y="571" text-anchor="middle" class="sm">CI clears effect + cost SLO?</text>
<path d="M1175 236 V280" fill="none" stroke="#fdba74" stroke-width="2.0" marker-end="url(#arr-orange)"/>
<path d="M1175 356 V400" fill="none" stroke="#a78bfa" stroke-width="2.0" marker-end="url(#arr-violet)"/>
<path d="M1175 476 V520" fill="none" stroke="#d4a574" stroke-width="2.0" marker-end="url(#arr-gold)"/>
<rect x="65" y="715" width="1270" height="66" rx="9" fill="#1a1a1a" stroke="#d4a574"/>
<text x="700" y="741" text-anchor="middle" class="mono">Checkpoint → classify(error) → retry | replan | wait-human | stop</text>
<text x="700" y="765" text-anchor="middle" class="sm">统计单位是 task；三次重复衡量模型波动，不应伪装成 60 个独立样本</text>
<line x1="65" y1="824" x2="99" y2="824" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="111" y="828" text-anchor="start" class="sm">控制/基线</text>
<line x1="300" y1="824" x2="334" y2="824" stroke="#6ee7b7" stroke-width="2" marker-end="url(#arr-mint)"/>
<text x="346" y="828" text-anchor="start" class="sm">恢复/收益</text>
<line x1="535" y1="824" x2="569" y2="824" stroke="#fdba74" stroke-width="2" marker-end="url(#arr-orange)"/>
<text x="581" y="828" text-anchor="start" class="sm">代价</text>
<line x1="770" y1="824" x2="804" y2="824" stroke="#f87171" stroke-width="2" marker-end="url(#arr-rose)"/>
<text x="816" y="828" text-anchor="start" class="sm">所有权/风险</text>
</svg>