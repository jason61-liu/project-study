<text x="124" y="119" class="lane-title" text-anchor="middle">LangGraph</text>
<rect x="264" y="181" width="96" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="312" y="194" class="edge-label" text-anchor="middle">checkpoint</text>
<rect x="264" y="316" width="96" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="312" y="329" class="edge-label" text-anchor="middle">put/search</text>
<rect x="264" y="466" width="96" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="312" y="479" class="edge-label" text-anchor="middle">trade-off</text>
<rect x="75" y="575" width="465" height="52" rx="8" fill="#fff7ed" stroke="#fdba74"/>
<text x="89" y="596" class="note-title" text-anchor="start">开发者负责</text>
<text x="89" y="615" class="note-text" text-anchor="start">定义 state/schema、何时写、提取什么、namespace ACL、冲突合并与遗忘策略</text>
<text x="709" y="119" class="lane-title" text-anchor="middle">Mem0</text>
<rect x="837" y="181" width="96" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="885" y="194" class="edge-label" text-anchor="middle">extract</text>
<rect x="837" y="316" width="96" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="885" y="329" class="edge-label" text-anchor="middle">persist</text>
<rect x="837" y="466" width="96" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="885" y="479" class="edge-label" text-anchor="middle">retrieve</text>
<rect x="655" y="575" width="465" height="52" rx="8" fill="#fff7ed" stroke="#fdba74"/>
<text x="669" y="596" class="note-title" text-anchor="start">平台/SDK负责较多</text>
<text x="669" y="615" class="note-text" text-anchor="start">事实抽取、去重、Embedding 和检索；应用仍负责授权、作用域过滤、更新/删除与质量评估</text>
<rect x="552" y="654" width="96" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="600" y="667" class="edge-label" text-anchor="middle">可组合</text>
<rect x="260" y="780" width="680" height="52" rx="8" fill="#fff7ed" stroke="#fdba74"/>
<text x="274" y="801" class="note-title" text-anchor="start">组合方式</text>
<text x="274" y="820" class="note-text" text-anchor="start">Checkpoint 保存当前图执行状态；LangGraph Store/Mem0 提供跨线程记忆。任何 namespace/filter 都必须从已验证 tenant/user 构造</text>
