<g data-graph-role="node"><rect x="390" y="395" width="210" height="65" fill="#f0fdf4"/><ellipse cx="495.0" cy="395" rx="105.0" ry="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><line x1="390" y1="395" x2="390" y2="460" stroke="#86efac" stroke-width="1.5"/><line x1="600" y1="395" x2="600" y2="460" stroke="#86efac" stroke-width="1.5"/><ellipse cx="495.0" cy="460" rx="105.0" ry="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="495.0" y="421" class="node-title" text-anchor="middle">Episodic</text><text x="495.0" y="441" class="detail" text-anchor="middle">过去事件与轨迹</text></g>
