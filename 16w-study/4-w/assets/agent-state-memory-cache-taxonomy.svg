<rect width="1200" height="900" fill="#ffffff"/>
<text x="600.0" y="38" class="title" text-anchor="middle">Agent 状态、记忆、业务事实与缓存的边界</text>
<text x="600.0" y="63" class="subtitle" text-anchor="middle">不要按“都能保存东西”归为 Memory；应按语义、作用域、权威性和生命周期区分</text>
