<rect x="374" y="661" width="96" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="422" y="674" class="edge-label" text-anchor="middle">read/write</text>
<rect x="729" y="661" width="96" height="18" rx="4" fill="#ffffff" opacity="0.95"/>
<text x="777" y="674" class="edge-label" text-anchor="middle">facts</text>
<rect x="185" y="775" width="830" height="52" rx="8" fill="#fff7ed" stroke="#fdba74"/>
<text x="199" y="796" class="note-title" text-anchor="start">核心约束</text>
<text x="199" y="815" class="note-text" text-anchor="start">Memory 是辅助上下文，不是订单/余额/ACL 的 source of truth；Cache 可随时丢弃，Checkpoint 负责恢复而非知识抽取</text>
<line x1="45" y1="875" x2="73" y2="875" stroke="#2563eb" stroke-width="3"/>
