<g data-graph-role="node"><rect x="950" y="390" width="155" height="75" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="1027.5" y="418" class="node-title" text-anchor="middle">Memory Policy</text><text x="1027.5" y="439" class="detail" text-anchor="middle">extract · merge · expire</text></g>
<g data-graph-role="node"><rect x="115" y="650" width="245" height="70" fill="#faf5ff"/><ellipse cx="237.5" cy="650" rx="122.5" ry="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/><line x1="115" y1="650" x2="115" y2="720" stroke="#c4b5fd" stroke-width="1.5"/><line x1="360" y1="650" x2="360" y2="720" stroke="#c4b5fd" stroke-width="1.5"/><ellipse cx="237.5" cy="720" rx="122.5" ry="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="237.5" y="676" class="node-title" text-anchor="middle">Business Database</text><text x="237.5" y="696" class="detail" text-anchor="middle">订单/余额/权限/审计</text></g>
<g data-graph-role="node"><rect x="485" y="645" width="230" height="75" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/><text x="600.0" y="673" class="node-title" text-anchor="middle">Tool/API Boundary</text><text x="600.0" y="694" class="detail" text-anchor="middle">transaction + authorization</text></g>
<g data-graph-role="node"><rect x="840" y="645" width="230" height="75" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/><text x="955.0" y="673" class="node-title" text-anchor="middle">Grounded Observation</text><text x="955.0" y="694" class="detail" text-anchor="middle">version + provenance</text></g>
