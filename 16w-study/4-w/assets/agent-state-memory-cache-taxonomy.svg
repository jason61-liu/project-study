<g data-graph-role="node"><rect x="60" y="165" width="220" height="75" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="170.0" y="193" class="node-title" text-anchor="middle">Conversation History</text><text x="170.0" y="214" class="detail" text-anchor="middle">消息序列；可裁剪</text></g>
