<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1110" width="1200" height="1110">
<style>
text { font-family:'PingFang SC','Hiragino Sans GB','Heiti SC','Helvetica Neue',Arial,sans-serif; }
.title{fill:#111827;font-size:25px;font-weight:700}.subtitle{fill:#64748b;font-size:13px}
.participant{fill:#111827;font-size:15px;font-weight:700}.small{fill:#64748b;font-size:11px}
.label{fill:#111827;font-size:13px}.message{fill:#111827;font-size:12px;font-weight:650}
.detail{fill:#64748b;font-size:10.5px}.frame-title{fill:#fff;font-size:12px;font-weight:700}
.frame-note{fill:#64748b;font-size:12px}.lifeline{stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:6 6}
.note-title{fill:#7c2d12;font-size:12px;font-weight:700}.note{fill:#9a3412;font-size:11px}.legend{fill:#475569;font-size:11.5px}
</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
</defs>
<text x="600" y="40" class="title" text-anchor="middle">用户授权后 Agent 调用工具：身份与令牌边界</text>
<text x="600" y="66" class="subtitle" text-anchor="middle">Authorization Code + PKCE / 面向资源的委托令牌 / 工具鉴权 / 过期与撤销</text>
<g data-graph-role="node"><rect x="43" y="100" width="224" height="62" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<text x="155" y="127" class="participant" text-anchor="middle">用户</text>
<text x="155" y="148" class="small" text-anchor="middle">资源所有者 / subject</text>
<line x1="155" y1="162" x2="155" y2="1000" class="lifeline"/></g>
<g data-graph-role="node"><rect x="338" y="100" width="224" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="450" y="127" class="participant" text-anchor="middle">Agent 应用</text>
<text x="450" y="148" class="small" text-anchor="middle">OAuth Client / actor</text>
<line x1="450" y1="162" x2="450" y2="1000" class="lifeline"/></g>
<g data-graph-role="node"><rect x="638" y="100" width="224" height="62" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="750" y="127" class="participant" text-anchor="middle">授权服务器 / STS</text>
<text x="750" y="148" class="small" text-anchor="middle">认证、同意、签发、撤销</text>
<line x1="750" y1="162" x2="750" y2="1000" class="lifeline"/></g>
<g data-graph-role="node"><rect x="933" y="100" width="224" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<text x="1045" y="127" class="participant" text-anchor="middle">工具 API / MCP Server</text>
<text x="1045" y="148" class="small" text-anchor="middle">Resource Server</text>
<line x1="1045" y1="162" x2="1045" y2="1000" class="lifeline"/></g>
<rect data-graph-role="container" x="45" y="180" width="1110" height="300" rx="10" fill="#f8fafc" fill-opacity="0.68" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="7 5"/>
<rect x="61" y="192" width="172" height="25" rx="12" fill="#111827"/>
<text x="147" y="210" class="frame-title" text-anchor="middle">1. 用户授权</text>
<text x="247" y="210" class="frame-note" text-anchor="start">Authorization Code + PKCE；OIDC 只负责登录身份</text>
<line data-graph-role="edge" x1="163" y1="235" x2="437" y2="235" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="302" y="225" class="message" text-anchor="middle">请求执行受保护操作</text>
<text x="302" y="252" class="detail" text-anchor="middle">用户意图；尚未授予工具权限</text>
<line data-graph-role="edge" x1="458" y1="290" x2="737" y2="290" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="600" y="280" class="message" text-anchor="middle">跳转 /authorize</text>
<text x="600" y="307" class="detail" text-anchor="middle">state + nonce + code_challenge + scope + resource</text>
<line data-graph-role="edge" x1="742" y1="345" x2="168" y2="345" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
<text x="452" y="335" class="message" text-anchor="middle">认证并征得同意</text>
<text x="452" y="362" class="detail" text-anchor="middle">展示具体资源、Scope 与 Agent 应用</text>
<line data-graph-role="edge" x1="742" y1="400" x2="463" y2="400" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" stroke-dasharray="7 5"/>
<text x="600" y="390" class="message" text-anchor="middle">回调：code + state</text>
<text x="600" y="417" class="detail" text-anchor="middle">Agent 必须校验 state；code 是一次性凭证</text>
<line data-graph-role="edge" x1="458" y1="455" x2="737" y2="455" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="600" y="445" class="message" text-anchor="middle">POST /token</text>
<text x="600" y="472" class="detail" text-anchor="middle">code + code_verifier + client authentication</text>
<rect data-graph-role="container" x="45" y="495" width="1110" height="185" rx="10" fill="#f8fafc" fill-opacity="0.68" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="7 5"/>
<rect x="61" y="507" width="172" height="25" rx="12" fill="#111827"/>
<text x="147" y="525" class="frame-title" text-anchor="middle">2. 建立会话与委托</text>
<text x="247" y="525" class="frame-note" text-anchor="start">不要把 ID Token 当作访问工具的 Access Token</text>
<line data-graph-role="edge" x1="742" y1="550" x2="463" y2="550" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" stroke-dasharray="7 5"/>
<text x="600" y="540" class="message" text-anchor="middle">签发 OIDC / OAuth 令牌</text>
<text x="600" y="567" class="detail" text-anchor="middle">ID Token（登录）+ Access Token + 可选 Refresh Token</text>
<line data-graph-role="edge" x1="458" y1="615" x2="737" y2="615" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="600" y="605" class="message" text-anchor="middle">可选：Token Exchange</text>
<text x="600" y="632" class="detail" text-anchor="middle">subject_token=user；actor=agent；resource=tool；缩小 scope</text>
<line data-graph-role="edge" x1="742" y1="660" x2="463" y2="660" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" stroke-dasharray="7 5"/>
<text x="600" y="650" class="message" text-anchor="middle">短期委托 Access Token</text>
<text x="600" y="677" class="detail" text-anchor="middle">sub=user，act=agent，aud=tool，scope=最小权限</text>
<rect data-graph-role="container" x="45" y="700" width="1110" height="180" rx="10" fill="#f8fafc" fill-opacity="0.68" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="7 5"/>
<rect x="61" y="712" width="172" height="25" rx="12" fill="#111827"/>
<text x="147" y="730" class="frame-title" text-anchor="middle">3. 调用工具</text>
<text x="247" y="730" class="frame-note" text-anchor="start">Resource Server 同时校验令牌、业务策略和工具参数</text>
<line data-graph-role="edge" x1="458" y1="755" x2="1032" y2="755" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="747" y="745" class="message" text-anchor="middle">tools/call / HTTPS API</text>
<text x="747" y="772" class="detail" text-anchor="middle">Bearer delegated token + idempotency-key + trace-id</text>
<line data-graph-role="edge" x1="1037" y1="810" x2="763" y2="810" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)" stroke-dasharray="7 5"/>
<text x="897" y="800" class="message" text-anchor="middle">可选：Introspection / JWKS</text>
<text x="897" y="827" class="detail" text-anchor="middle">验证 active 或签名、iss、aud、exp；密钥与状态可缓存</text>
<line data-graph-role="edge" x1="1037" y1="860" x2="463" y2="860" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" stroke-dasharray="7 5"/>
<text x="747" y="850" class="message" text-anchor="middle">结构化结果 + 审计标识</text>
<text x="747" y="877" class="detail" text-anchor="middle">授权还要检查 scope、tenant、sub/act、资源归属与参数</text>
<rect data-graph-role="container" x="45" y="900" width="1110" height="105" rx="10" fill="#f8fafc" fill-opacity="0.68" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="7 5"/>
<rect x="61" y="912" width="172" height="25" rx="12" fill="#111827"/>
<text x="147" y="930" class="frame-title" text-anchor="middle">4. 过期 / 撤销</text>
<text x="247" y="930" class="frame-note" text-anchor="start">取消请求不等于撤销令牌，撤销令牌也不等于回滚已发生的副作用</text>
<line data-graph-role="edge" x1="1037" y1="958" x2="463" y2="958" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="7 5"/>
<text x="747" y="948" class="message" text-anchor="middle">401 invalid_token / 403 insufficient_scope</text>
<text x="747" y="975" class="detail" text-anchor="middle">刷新或重新交换后，仅在幂等或确认未执行时重试</text>
<rect x="58" y="1025" width="1084" height="46" rx="9" fill="#fff7ed" stroke="#fdba74"/>
<text x="76" y="1044" class="note-title" text-anchor="start">关键约束</text>
<text x="76" y="1062" class="note" text-anchor="start">ID Token 的 audience 是 Agent Client；工具只接受面向自身 audience 的 Access Token。Token Exchange 是可选模式，需授权服务器支持。</text>
<line x1="365" y1="1082" x2="393" y2="1082" stroke="#2563eb" stroke-width="3"/>
<text x="401" y="1086" class="legend" text-anchor="start">请求 / 调用</text>
<line x1="500" y1="1082" x2="528" y2="1082" stroke="#ea580c" stroke-width="3"/>
<text x="536" y="1086" class="legend" text-anchor="start">用户控制 / 校验</text>
<line x1="665" y1="1082" x2="693" y2="1082" stroke="#16a34a" stroke-width="3"/>
<text x="701" y="1086" class="legend" text-anchor="start">令牌 / 结果</text>
<line x1="800" y1="1082" x2="828" y2="1082" stroke="#dc2626" stroke-width="3"/>
<text x="836" y="1086" class="legend" text-anchor="start">异常 / 撤销</text>
</svg>