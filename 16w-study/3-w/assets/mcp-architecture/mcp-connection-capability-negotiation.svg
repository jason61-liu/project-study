<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940">
<style>
text { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Heiti SC', 'Helvetica Neue', Arial, sans-serif; }
.title { fill:#111827; font-size:24px; font-weight:700; }
.subtitle { fill:#6b7280; font-size:13px; }
.participant { fill:#111827; font-size:15px; font-weight:700; }
.label { fill:#111827; font-size:13px; }
.small { fill:#6b7280; font-size:11px; }
.message { fill:#111827; font-size:13px; font-weight:600; }
.detail { fill:#6b7280; font-size:11px; }
.frame-title { fill:#ffffff; font-size:12px; font-weight:700; }
.frame-note { fill:#64748b; font-size:12px; }
.lifeline { stroke:#94a3b8; stroke-width:1.2; stroke-dasharray:6 6; }
.legend { fill:#475569; font-size:12px; }
</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
</defs>
<rect width="1200" height="940" fill="#ffffff"/>
<text x="600" y="40" class="title" text-anchor="middle">MCP 连接建立与能力协商（2026-07-28）</text>
<text x="600" y="64" class="subtitle" text-anchor="middle">无状态 JSON-RPC：发现可缓存，但每个请求仍携带版本、身份与客户端能力</text>
<rect data-graph-role="container" x="48" y="166" width="1104" height="174" rx="10" fill="#f9fafb" fill-opacity="0.58" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="7 5"/>
<rect x="64" y="178" width="154" height="24" rx="12" fill="#111827"/>
<text x="141" y="195" class="frame-title" text-anchor="middle">阶段 1 · 连接</text>
<text x="232" y="195" class="frame-note" text-anchor="start">专用 Client + Transport</text>
<rect data-graph-role="container" x="48" y="352" width="1104" height="330" rx="10" fill="#f9fafb" fill-opacity="0.58" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="7 5"/>
<rect x="64" y="364" width="154" height="24" rx="12" fill="#111827"/>
<text x="141" y="381" class="frame-title" text-anchor="middle">阶段 2 · 发现</text>
<text x="232" y="381" class="frame-note" text-anchor="start">可选调用，可按返回提示缓存</text>
<rect data-graph-role="container" x="48" y="696" width="1104" height="166" rx="10" fill="#f9fafb" fill-opacity="0.58" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="7 5"/>
<rect x="64" y="708" width="154" height="24" rx="12" fill="#111827"/>
<text x="141" y="725" class="frame-title" text-anchor="middle">阶段 3 · 就绪</text>
<text x="232" y="725" class="frame-note" text-anchor="start">按双方能力注册</text>
<g data-graph-role="node"><rect x="36" y="88" width="208" height="58" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
<text x="140" y="114" class="participant" text-anchor="middle">MCP Host</text>
<text x="140" y="134" class="small" text-anchor="middle">AI 应用 / Client Manager</text>
<line x1="140" y1="146" x2="140" y2="850" class="lifeline"/></g>
<g data-graph-role="node"><rect x="316" y="88" width="208" height="58" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.8"/>
<text x="420" y="114" class="participant" text-anchor="middle">MCP Client</text>
<text x="420" y="134" class="small" text-anchor="middle">每个 Server 一个专用连接</text>
<line x1="420" y1="146" x2="420" y2="850" class="lifeline"/></g>
<g data-graph-role="node"><rect x="626" y="88" width="208" height="58" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.8"/>
<text x="730" y="114" class="participant" text-anchor="middle">Transport</text>
<text x="730" y="134" class="small" text-anchor="middle">stdio 或 Streamable HTTP</text>
<line x1="730" y1="146" x2="730" y2="850" class="lifeline"/></g>
<g data-graph-role="node"><rect x="946" y="88" width="208" height="58" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>
<text x="1050" y="114" class="participant" text-anchor="middle">MCP Server</text>
<text x="1050" y="134" class="small" text-anchor="middle">本地或远程能力提供者</text>
<line x1="1050" y1="146" x2="1050" y2="850" class="lifeline"/></g>
<rect x="415" y="198" width="10" height="638" rx="3" fill="#ddd6fe" stroke="#ffffff" stroke-width="1"/>
<rect x="725" y="246" width="10" height="440" rx="3" fill="#fed7aa" stroke="#ffffff" stroke-width="1"/>
<rect x="1045" y="280" width="10" height="556" rx="3" fill="#bbf7d0" stroke="#ffffff" stroke-width="1"/>
<line x1="148" y1="224" x2="408" y2="224" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" data-graph-role="edge"/>
<text x="280" y="215" class="message" text-anchor="middle">创建专用 MCP Client</text>
<text x="280" y="240" class="detail" text-anchor="middle">读取 Server 配置</text>
<line x1="428" y1="270" x2="718" y2="270" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)" data-graph-role="edge"/>
<text x="575" y="261" class="message" text-anchor="middle">打开 Transport</text>
<text x="575" y="286" class="detail" text-anchor="middle">stdio: 启动子进程；HTTP: 建连并认证</text>
<line x1="738" y1="316" x2="1038" y2="316" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)" data-graph-role="edge"/>
<text x="890" y="307" class="message" text-anchor="middle">建立可交换 JSON-RPC 的通道</text>
<line x1="428" y1="404" x2="718" y2="404" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" data-graph-role="edge"/>
<text x="575" y="395" class="message" text-anchor="middle">server/discover</text>
<text x="575" y="420" class="detail" text-anchor="middle">_meta: protocolVersion + clientInfo + clientCapabilities</text>
<line x1="738" y1="442" x2="1038" y2="442" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)" data-graph-role="edge"/>
<text x="890" y="433" class="message" text-anchor="middle">转发带帧请求</text>
<line x1="1042" y1="488" x2="742" y2="488" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" data-graph-role="edge"/>
<text x="890" y="479" class="message" text-anchor="middle">Discover Result</text>
<text x="890" y="504" class="detail" text-anchor="middle">supportedVersions + capabilities + serverInfo + ttlMs</text>
<line x1="722" y1="526" x2="432" y2="526" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" data-graph-role="edge"/>
<text x="575" y="517" class="message" text-anchor="middle">返回发现结果</text>
<rect data-graph-role="decoration" x="378" y="550" width="716" height="112" rx="8" fill="#fff7f7" stroke="#fecaca" stroke-width="1"/>
<text x="394" y="570" class="detail" text-anchor="start">alt · 请求版本不受支持</text>
<line x1="1042" y1="594" x2="742" y2="594" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="7 5" data-graph-role="edge"/>
<text x="890" y="585" class="message" text-anchor="middle">UnsupportedProtocolVersionError</text>
<text x="890" y="610" class="detail" text-anchor="middle">附带 Server 支持的版本列表</text>
<line x1="722" y1="628" x2="432" y2="628" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="7 5" data-graph-role="edge"/>
<text x="575" y="619" class="message" text-anchor="middle">转发版本错误</text>
<text x="432" y="656" class="detail" text-anchor="start">Client 选择交集版本并重试；若无交集则连接不可用</text>
<line x1="412" y1="752" x2="152" y2="752" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)" data-graph-role="edge"/>
<text x="280" y="743" class="message" text-anchor="middle">缓存能力矩阵并标记 Ready</text>
<text x="280" y="768" class="detail" text-anchor="middle">缓存受 ttlMs / cacheScope 约束</text>
<line x1="148" y1="790" x2="408" y2="790" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" data-graph-role="edge"/>
<text x="280" y="781" class="message" text-anchor="middle">按已协商能力注册功能</text>
<text x="280" y="806" class="detail" text-anchor="middle">例如 tools / resources / prompts / elicitation</text>
<line x1="428" y1="828" x2="1038" y2="828" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)" data-graph-role="edge"/>
<text x="735" y="819" class="message" text-anchor="middle">tools/list 或 subscriptions/listen</text>
<text x="735" y="844" class="detail" text-anchor="middle">每个请求继续携带同一组 _meta</text>
<line x1="70" y1="902" x2="104" y2="902" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="116" y="906" class="legend" text-anchor="start">协议请求</text>
<line x1="226" y1="902" x2="260" y2="902" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="272" y="906" class="legend" text-anchor="start">能力/结果</text>
<line x1="392" y1="902" x2="426" y2="902" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
<text x="438" y="906" class="legend" text-anchor="start">Transport 控制</text>
<line x1="594" y1="902" x2="628" y2="902" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
<text x="640" y="906" class="legend" text-anchor="start">协商失败分支</text>
<text x="1130" y="906" class="legend" text-anchor="end">注意：当前版本不是 initialize/initialized 握手</text>
</svg>
