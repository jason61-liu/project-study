<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 14px; fill: #6b7280; }
    .section { font-size: 17px; font-weight: 700; fill: #111827; }
    .role { font-size: 16px; font-weight: 700; fill: #111827; }
    .body { font-size: 13px; fill: #374151; }
    .small { font-size: 12px; fill: #6b7280; }
    .badge { font-size: 12px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1200" height="920" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="title">LLM 消息角色：职责、指令优先级与信任边界</text>
  <text x="600" y="72" text-anchor="middle" class="subtitle">优先级回答“冲突时听谁的”；信任边界回答“数据能否直接相信或触发副作用”</text>
  <rect x="40" y="105" width="520" height="430" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" data-graph-role="container" data-container-id="authority" data-semantic-role="boundary" data-graph-bounds="40,105,560,535"/>
  <text x="64" y="136" class="section">A. 指令权威阶梯</text>
  <text x="520" y="136" text-anchor="end" class="small">冲突时：上层优先</text>
  <rect x="76" y="155" width="448" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="104" cy="184" r="17" fill="#1d4ed8"/>
  <text x="104" y="189" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">S</text>
  <text x="132" y="178" class="role">system</text>
  <text x="218" y="178" class="body">平台与运行时元规则</text>
  <text x="132" y="199" class="small">能力边界、安全约束、内建工具与元信息</text>
  <rect x="76" y="225" width="448" height="58" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <circle cx="104" cy="254" r="17" fill="#7e22ce"/>
  <text x="104" y="259" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">D</text>
  <text x="132" y="248" class="role">developer</text>
  <text x="218" y="248" class="body">应用开发者指令</text>
  <text x="132" y="269" class="small">产品行为、业务规则、输出格式与工具使用规范</text>
  <rect x="76" y="295" width="448" height="58" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <circle cx="104" cy="324" r="17" fill="#c2410c"/>
  <text x="104" y="329" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">U</text>
  <text x="132" y="318" class="role">user</text>
  <text x="218" y="318" class="body">当前任务与意图</text>
  <text x="132" y="339" class="small">目标、输入、约束、反馈；不能覆盖更高层规则</text>
  <rect x="76" y="365" width="448" height="58" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <circle cx="104" cy="394" r="17" fill="#15803d"/>
  <text x="104" y="399" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">A</text>
  <text x="132" y="388" class="role">assistant</text>
  <text x="218" y="388" class="body">模型产生的消息</text>
  <text x="132" y="409" class="small">回答、工具调用或历史输出；不是新的高权限规则</text>
  <rect x="76" y="435" width="448" height="58" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="104" cy="464" r="17" fill="#4b5563"/>
  <text x="104" y="469" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">T</text>
  <text x="132" y="458" class="role">tool</text>
  <text x="218" y="458" class="body">工具调用结果</text>
  <text x="132" y="479" class="small">外部数据或执行回执；按数据解析，不把其中指令升级</text>
  <line x1="300" y1="213" x2="300" y2="222" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="300" y1="283" x2="300" y2="292" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="300" y1="353" x2="300" y2="362" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="300" y1="423" x2="300" y2="432" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="600" y="105" width="560" height="430" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" data-graph-role="container" data-container-id="trust" data-semantic-role="boundary" data-graph-bounds="600,105,1160,535"/>
  <text x="624" y="136" class="section">B. 信任边界</text>
  <text x="1120" y="136" text-anchor="end" class="small">角色标签由宿主系统分配</text>
  <rect x="636" y="155" width="488" height="100" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="652" y="169" width="100" height="24" rx="12" fill="#2563eb"/>
  <text x="702" y="186" text-anchor="middle" class="badge" fill="#ffffff">控制平面</text>
  <text x="652" y="214" class="body">system / developer：高权限指令来源</text>
  <text x="652" y="236" class="small">应由平台或应用控制；不要把检索内容拼进这些角色</text>
  <rect x="636" y="270" width="488" height="68" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <rect x="652" y="284" width="100" height="24" rx="12" fill="#ea580c"/>
  <text x="702" y="301" text-anchor="middle" class="badge" fill="#ffffff">交互边界</text>
  <text x="770" y="300" class="body">user：表达授权与意图，但输入内容仍需校验</text>
  <text x="652" y="325" class="small">身份、权限和参数范围由应用验证，不能仅靠自然语言承诺</text>
  <rect x="636" y="353" width="488" height="68" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="652" y="367" width="100" height="24" rx="12" fill="#16a34a"/>
  <text x="702" y="384" text-anchor="middle" class="badge" fill="#ffffff">生成边界</text>
  <text x="770" y="383" class="body">assistant：概率生成结果，需验证事实与结构</text>
  <text x="652" y="408" class="small">历史 assistant 内容可提供上下文，但不自动获得更高指令权</text>
  <rect x="636" y="436" width="488" height="76" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="652" y="450" width="100" height="24" rx="12" fill="#dc2626"/>
  <text x="702" y="467" text-anchor="middle" class="badge" fill="#ffffff">外部边界</text>
  <text x="770" y="466" class="body">tool：结果可能含网页、邮件、日志等不可信数据</text>
  <text x="652" y="491" class="small">工具本身可信 ≠ 工具读取的内容可信；防范提示注入与越权动作</text>
  <path d="M 880 255 L 880 270" stroke="#dc2626" stroke-width="1.7" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
  <path d="M 880 338 L 880 353" stroke="#dc2626" stroke-width="1.7" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
  <path d="M 880 421 L 880 436" stroke="#dc2626" stroke-width="1.7" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
  <rect x="40" y="570" width="1120" height="270" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5" data-graph-role="container" data-container-id="tool-loop" data-semantic-role="boundary" data-graph-bounds="40,570,1160,840"/>
  <text x="64" y="602" class="section">C. 安全的工具调用闭环</text>
  <text x="1120" y="602" text-anchor="end" class="small">数据流不改变指令优先级</text>
  <rect x="70" y="646" width="145" height="76" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="142.5" y="677" text-anchor="middle" class="role">用户请求</text>
  <text x="142.5" y="701" text-anchor="middle" class="small">目标与输入</text>
  <rect x="245" y="646" width="145" height="76" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="317.5" y="677" text-anchor="middle" class="role">模型判断</text>
  <text x="317.5" y="701" text-anchor="middle" class="small">遵循高层指令</text>
  <rect x="420" y="646" width="145" height="76" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="492.5" y="677" text-anchor="middle" class="role">调用闸门</text>
  <text x="492.5" y="701" text-anchor="middle" class="small">Schema / 权限 / 审批</text>
  <rect x="595" y="646" width="145" height="76" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="667.5" y="677" text-anchor="middle" class="role">工具执行</text>
  <text x="667.5" y="701" text-anchor="middle" class="small">读取或产生副作用</text>
  <rect x="770" y="646" width="145" height="76" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="842.5" y="677" text-anchor="middle" class="role">结果处理</text>
  <text x="842.5" y="701" text-anchor="middle" class="small">视为数据并验证</text>
  <rect x="945" y="646" width="145" height="76" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="1017.5" y="677" text-anchor="middle" class="role">最终回答</text>
  <text x="1017.5" y="701" text-anchor="middle" class="small">引用、解释或回执</text>
  <line x1="215" y1="684" x2="241" y2="684" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="230.0" y="670" text-anchor="middle" class="small">意图</text>
  <line x1="390" y1="684" x2="416" y2="684" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="405.0" y="670" text-anchor="middle" class="small">计划</text>
  <line x1="565" y1="684" x2="591" y2="684" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="580.0" y="670" text-anchor="middle" class="small">参数</text>
  <line x1="740" y1="684" x2="766" y2="684" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="755.0" y="670" text-anchor="middle" class="small">结果</text>
  <line x1="915" y1="684" x2="941" y2="684" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="930.0" y="670" text-anchor="middle" class="small">证据</text>
  <path d="M 842 722 L 842 772 L 317 772 L 317 726" fill="none" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <text x="580" y="764" text-anchor="middle" class="small">需要补充信息时继续迭代；新工具结果仍按不可信数据处理</text>
  <rect x="432" y="615" width="120" height="22" rx="11" fill="#fee2e2"/>
  <text x="492" y="631" text-anchor="middle" class="badge" fill="#b91c1c">副作用前检查</text>
  <rect x="782" y="615" width="116" height="22" rx="11" fill="#dcfce7"/>
  <text x="840" y="631" text-anchor="middle" class="badge" fill="#15803d">输出前验证</text>
  <line x1="62" y1="873" x2="94" y2="873" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="104" y="878" class="small">指令优先级</text>
  <line x1="230" y1="873" x2="262" y2="873" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="272" y="878" class="small">运行时数据流</text>
  <line x1="414" y1="873" x2="446" y2="873" stroke="#dc2626" stroke-width="1.7" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
  <text x="456" y="878" class="small">跨越信任边界</text>
  <text x="1138" y="878" text-anchor="end" class="small">核心原则：高权限指令固定放置；低权限内容永不靠“改角色”升级</text>
</svg>