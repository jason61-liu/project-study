[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-summarizer"
version = "0.1.0"
description = "CLI tool to summarize WeChat Official Account articles"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "typer>=0.9.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
wechat-summarizer = "wechat_summarizer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
