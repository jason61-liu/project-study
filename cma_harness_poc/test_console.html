<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMA Harness POC — 测试控制台</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --radius: 6px;
  --font: 'SFMono-Regular', 'Consolas', 'Liberation Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 24px;
  max-width: 1200px;
  margin: 0 auto;
}
h1 { font-size: 20px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
h1 small { font-size: 13px; color: var(--text-muted); font-weight: normal; }
.subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.card h2 { font-size: 14px; margin-bottom: 12px; color: var(--accent); }
label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
input, textarea, select {
  width: 100%;
  padding: 6px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 13px;
  font-family: var(--font);
  margin-bottom: 8px;
}
textarea { font-family: var(--font); resize: vertical; min-height: 40px; }
.btn {
  padding: 6px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: #21262d;
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: #30363d; }
.btn-primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
.btn-primary:hover { background: #388bfd; }
.btn-danger { color: var(--red); }
.btn-sm { padding: 3px 8px; font-size: 11px; }
.flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mb8 { margin-bottom: 8px; }
.mt8 { margin-top: 8px; }
.w50 { width: 50%; }

/* Log / SSE */
#log {
  background: #010409;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px;
  font-family: var(--font);
  font-size: 12px;
  height: 360px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.6;
}
.log-entry { padding: 2px 0; border-bottom: 1px solid #1c2128; }
.log-entry:last-child { border-bottom: none; }
.log-time { color: var(--text-muted); margin-right: 8px; }
.log-type { font-weight: bold; }
.log-type.running { color: var(--yellow); }
.log-type.tool_use { color: var(--accent); }
.log-type.tool_result { color: var(--green); }
.log-type.message { color: #c9d1d9; }
.log-type.idle { color: var(--green); }
.log-type.error { color: var(--red); }
.log-type.terminated { color: var(--red); }
.log-type.thinking { color: #c9d1d9; font-style: italic; }
.log-type.thinking\\.delta { color: #8b949e; font-style: italic; }
.log-preview { color: var(--text-muted); margin-left: 8px; }

/* Status badges */
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 12px;
  font-size: 11px; font-weight: 600;
}
.badge-idle { background: #0d5320; color: #7ee787; }
.badge-running { background: #5a3e00; color: #d29922; }
.badge-terminated { background: #5c1010; color: #ff7b72; }

.result-block {
  background: #010409; border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px;
  font-family: var(--font); font-size: 12px;
  white-space: pre-wrap; word-break: break-all;
  max-height: 200px; overflow-y: auto;
  margin-top: 4px;
}
.empty { color: var(--text-muted); font-style: italic; }
</style>
</head>
<body>

<h1>⚙️ CMA Harness POC <small>测试控制台</small></h1>
<p class="subtitle">所有操作在浏览器完成，不需要 curl。API 服务地址: <span id="apiBaseDisplay">/</span></p>

<div class="grid">
  <!-- LEFT: Agent + Session -->
  <div>
    <div class="card">
      <h2>📦 Agent</h2>
      <div class="flex mb8">
        <input id="agentName" placeholder="agent name" value="demo-agent" style="flex:1">
        <input id="agentModel" placeholder="model" value="deepseek-chat" style="flex:1">
      </div>
      <div class="flex mb8">
        <input id="agentSystem" placeholder="system prompt (optional)" value="You are a helpful assistant. Use bash." style="flex:3">
        <button class="btn btn-primary" onclick="createAgent()">+ 创建</button>
      </div>
      <div class="flex mb8">
        <input id="agentSkills" placeholder='skills JSON (e.g. [{"type":"skill","name":"web_search"}])' style="flex:1">
        <input id="agentMcp" placeholder='mcp_servers JSON (optional)' style="flex:1">
      </div>
      <div id="agentResult"></div>
      <div class="mt8">
        <button class="btn btn-sm" onclick="listAgents()">📋 列表</button>
        <span id="agentList"></span>
      </div>
    </div>

    <div class="card">
      <h2>🔗 Session</h2>
      <div class="flex mb8">
        <input id="sessionAgentId" placeholder="agent_id (从上方选)" style="flex:2">
        <button class="btn btn-primary" onclick="createSession()">+ 创建</button>
      </div>
      <div id="sessionResult"></div>
      <div class="mt8">
        <button class="btn btn-sm" onclick="listSessions()">📋 列表</button>
        <span id="sessionList"></span>
      </div>
    </div>

    <div class="card">
      <h2>📤 发送事件</h2>
      <div class="flex mb8">
        <input id="targetSession" placeholder="session_id" style="flex:2">
        <input id="eventText" placeholder="user message text" value="Run: echo hello-cma" style="flex:3">
        <button class="btn btn-primary" onclick="postEvent()">发送</button>
      </div>
      <div class="flex">
        <button class="btn btn-sm btn-danger" onclick="postInterrupt()">⏹ 中断</button>
        <button class="btn btn-sm" onclick="getSession()">🔍 查状态</button>
        <button class="btn btn-sm" onclick="getEvents()">📜 事件历史</button>
      </div>
      <div id="eventResult"></div>
    </div>
  </div>

  <!-- RIGHT: SSE Log + Quick start -->
  <div>
    <div class="card" style="height:100%; display:flex; flex-direction:column;">
      <div class="flex mb8" style="justify-content:space-between;">
        <h2 style="margin:0;">📡 SSE 事件流</h2>
        <div>
          <span id="sseStatus" class="badge badge-idle">未连接</span>
          <button id="sseBtn" class="btn btn-sm" onclick="toggleSSE()">▶ 连接</button>
          <button class="btn btn-sm" onclick="clearLog()">🗑 清空</button>
        </div>
      </div>
      <div id="log"><span class="empty">点击 "连接" 开始监听 SSE 事件流</span></div>
    </div>
  </div>
</div>

<!-- 快速启动 -->
<div class="card">
  <h2>🚀 快速启动（一键完成创建 agent → session → 发送消息）</h2>
  <div class="flex mb8">
    <input id="quickModel" value="deepseek-chat" style="width:200px" placeholder="model">
    <input id="quickMessage" value="Run: echo hello-cma" style="width:300px" placeholder="user message">
    <button class="btn btn-primary" onclick="quickStart()">⚡ 一键测试</button>
  </div>
  <div id="quickResult"></div>
</div>

<script>
const BASE = '';
let sseActive = false;
let sseClient = null;
let currentSid = '';

function $(id) { return document.getElementById(id); }
function show(id, html) { $(id).innerHTML = html; }

async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type': 'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const resp = await fetch(BASE + path, opts);
  const text = await resp.text();
  let data;
  try { data = JSON.parse(text); } catch { data = text; }
  return { status: resp.status, ok: resp.ok, data, text };
}

function formatJSON(obj) {
  const s = JSON.stringify(obj, null, 2);
  return `<div class="result-block">${s}</div>`;
}

// ── Agent ──
async function createAgent() {
  const body = {
    name: $('agentName').value,
    model: $('agentModel').value,
    system: $('agentSystem').value,
  };
  const skillsVal = $('agentSkills').value;
  if (skillsVal) { try { body.skills = JSON.parse(skillsVal); } catch {} }
  const mcpVal = $('agentMcp').value;
  if (mcpVal) { try { body.mcp_servers = JSON.parse(mcpVal); } catch {} }
  const r = await api('POST', '/v1/agents', body);
  show('agentResult', `${r.ok?'✅':'❌'} ${r.status}: ${formatJSON(r.data)}`);
  if (r.ok) $('sessionAgentId').value = r.data.id;
}

async function listAgents() {
  const r = await api('GET', '/v1/agents');
  if (!r.ok) { show('agentList', `错误: ${r.status}`); return; }
  const agents = Array.isArray(r.data) ? r.data : (r.data.data || []);
  if (agents.length === 0) { show('agentList', '<span class="empty">空</span>'); return; }
  let html = '';
  for (const a of agents) {
    html += `<button class="btn btn-sm" onclick="$('sessionAgentId').value='${a.id}'">${a.name} (${a.id.slice(0,16)}…)</button> `;
  }
  show('agentList', html);
}

// ── Session ──
async function createSession() {
  const agentId = $('sessionAgentId').value;
  if (!agentId) { show('sessionResult', '❌ 请先输入 agent_id'); return; }
  const r = await api('POST', '/v1/sessions', {
    agent: { type: 'agent', id: agentId },
  });
  show('sessionResult', `${r.ok?'✅':'❌'} ${r.status}: ${formatJSON(r.data)}`);
  if (r.ok) {
    $('targetSession').value = r.data.id;
    currentSid = r.data.id;
    // Auto-connect SSE for this session
    if (!sseActive) toggleSSE();
  }
}

async function listSessions() {
  // CMA doesn't have list sessions endpoint, use internal status
  show('sessionList', '<span class="empty">使用 agent 端创建 session</span>');
}

async function getSession() {
  const sid = $('targetSession').value;
  if (!sid) { show('eventResult', '❌ 请先输入 session_id'); return; }
  const r = await api('GET', `/v1/sessions/${sid}`);
  show('eventResult', `${r.ok?'✅':'❌'} ${r.status}: ${formatJSON(r.data)}`);
}

async function getEvents() {
  const sid = $('targetSession').value;
  if (!sid) { show('eventResult', '❌ 请先输入 session_id'); return; }
  const r = await api('GET', `/v1/sessions/${sid}/events`);
  if (!r.ok) { show('eventResult', `❌ ${r.status}: ${r.text}`); return; }
  show('eventResult', `✅ ${r.data.events.length} 个事件: ${formatJSON(r.data)}`);
}

// ── Events ──
async function postEvent() {
  const sid = $('targetSession').value;
  const text = $('eventText').value;
  if (!sid) { show('eventResult', '❌ 请先输入 session_id'); return; }
  // Reconnect SSE if needed
  if (sseClient && currentSid !== sid) {
    closeSSE();
    currentSid = sid;
    toggleSSE();
  }
  const r = await api('POST', `/v1/sessions/${sid}/events`, {
    events: [{ type: 'user.message', content: [{ type: 'text', text }] }],
  });
  show('eventResult', `${r.ok?'✅':'❌'} ${r.status}: ${formatJSON(r.data)}`);
}

async function postInterrupt() {
  const sid = $('targetSession').value;
  if (!sid) return;
  const r = await api('POST', `/v1/sessions/${sid}/events`, {
    events: [{ type: 'user.interrupt' }],
  });
  show('eventResult', `${r.ok?'✅':'❌'} ${r.status}: ${formatJSON(r.data)}`);
}

// ── SSE ──
function addLogEvent(data) {
  const log = $('log');
  const type = data.type || 'unknown';
  const ts = data.processed_at ? new Date(data.processed_at * 1000).toLocaleTimeString() : '';
  let cls = 'log-type';
  if (type.includes('running')) cls += ' running';
  else if (type === 'agent.tool_use') cls += ' tool_use';
  else if (type === 'agent.tool_result') cls += ' tool_result';
  else if (type === 'agent.message') cls += ' message';
  else if (type === 'agent.thinking') cls += ' thinking';
  else if (type === 'agent.thinking.delta') cls += ' thinking.delta';
  else if (type === 'session.status_idle') cls += ' idle';
  else if (type === 'session.error') cls += ' error';
  else if (type === 'session.status_terminated') cls += ' terminated';

  let preview = '';
  if (data.content && Array.isArray(data.content)) {
    const texts = data.content.map(c => c.text || c.thinking || '').join(' ').slice(0, 80);
    preview = texts;
  } else if (data.name) {
    preview = `${data.name}(${JSON.stringify(data.input || {}).slice(0, 60)})`;
  }

  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `<span class="log-time">${ts}</span><span class="${cls}">${type}</span><span class="log-preview">${preview}</span>`;
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

function clearLog() {
  $('log').innerHTML = '<span class="empty">日志已清空</span>';
}

function closeSSE() {
  if (sseClient) {
    sseClient.close();
    sseClient = null;
  }
  sseActive = false;
  $('sseStatus').textContent = '未连接';
  $('sseStatus').className = 'badge badge-idle';
  $('sseBtn').textContent = '▶ 连接';
}

async function toggleSSE() {
  if (sseActive) { closeSSE(); return; }

  const sid = $('targetSession').value;
  if (!sid) {
    // Auto-use current session if available
    if (currentSid) { $('targetSession').value = currentSid; }
    else { addLogEvent({ type: '⚠️ 请先创建 session 或输入 session_id' }); return; }
  }

  currentSid = $('targetSession').value || currentSid;
  sseActive = true;
  $('sseStatus').textContent = '连接中...';
  $('sseStatus').className = 'badge badge-running';
  $('sseBtn').textContent = '⏹ 断开';

  const log = $('log');
  if (log.querySelector('.empty')) log.innerHTML = '';

  try {
    const resp = await fetch(`${BASE}/v1/sessions/${currentSid}/events/stream`);
    $('sseStatus').textContent = '已连接';
    $('sseStatus').className = 'badge badge-running';

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      while (buf.includes('\n\n')) {
        const idx = buf.indexOf('\n\n');
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 2);
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            addLogEvent(data);
            if (data.type === 'session.status_idle') {
              $('sseStatus').textContent = '已完成';
              $('sseStatus').className = 'badge badge-idle';
            }
          } catch {}
        }
      }
    }
  } catch (err) {
    addLogEvent({ type: `❌ SSE 错误: ${err.message}` });
  }

  closeSSE();
}

// ── Quick Start ──
async function quickStart() {
  const qr = $('quickResult');
  qr.innerHTML = '⏳ 创建 agent...';
  const model = $('quickModel').value;
  const msg = $('quickMessage').value;

  // Create agent
  const a = await api('POST', '/v1/agents', { name: 'quick-test', model, system: 'You are a helpful assistant. Use bash.' });
  if (!a.ok) { qr.innerHTML = `❌ Agent 创建失败: ${a.status}`; return; }
  const agentId = a.data.id;
  qr.innerHTML += ` ✅ agent=${agentId.slice(0,16)}…<br>⏳ 创建 session...`;

  // Create session
  const s = await api('POST', '/v1/sessions', { agent: { type: 'agent', id: agentId } });
  if (!s.ok) { qr.innerHTML += `❌ Session 创建失败: ${s.status}`; return; }
  const sessionId = s.data.id;
  $('sessionAgentId').value = agentId;
  $('targetSession').value = sessionId;
  currentSid = sessionId;
  qr.innerHTML += ` ✅ session=${sessionId.slice(0,16)}…<br>⏳ 发送消息...`;

  // Post event
  const e = await api('POST', `/v1/sessions/${sessionId}/events`, {
    events: [{ type: 'user.message', content: [{ type: 'text', text: msg }] }],
  });
  if (!e.ok) { qr.innerHTML += `❌ 事件发送失败: ${e.status}`; return; }
  qr.innerHTML += ` ✅ 已发送<br>📡 自动连接 SSE...`;

  // Auto connect SSE
  clearLog();
  if (sseActive) closeSSE();
  $('log').innerHTML = '';
  toggleSSE();
}

// ── Init ──
$('apiBaseDisplay').textContent = window.location.origin;
</script>
</body>
</html>
